[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enum2x2"
version = "0.1.0"
description = "Every 2x2 table compatible with a published agreement statistic"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Elliot Tower", email = "elliot@elliottower.ai" }]
keywords = ["contingency table", "cohen's kappa", "agreement", "meta-research",
            "reporting", "reproducibility"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
enum2x2 = "enum2x2.__main__:main"

[project.urls]
Homepage = "https://github.com/elliottower/enum2x2"

[tool.hatch.build.targets.wheel]
packages = ["src/enum2x2"]
